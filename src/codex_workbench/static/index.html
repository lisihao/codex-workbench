<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Codex Workbench</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <header>
      <div><p class="eyebrow">MAC MINI · SINGLE AUTHORITY</p><h1>Codex Workbench</h1></div>
      <div id="health" class="pill pending">连接中</div>
    </header>
    <main>
      <section class="metrics" id="metrics"></section>
      <section id="capability-section">
        <div class="section-title"><h2>模型与 Agent 能力</h2><span id="capability-summary">N/A</span></div>
        <div id="capabilities" class="capabilities"><p class="muted">正在读取能力目录…</p></div>
      </section>
      <section id="approval-section">
        <div class="section-title"><h2>待处理审批</h2><span id="approval-summary">N/A</span></div>
        <div id="approvals" class="approvals"><p class="muted">正在读取持久审批回执…</p></div>
      </section>
      <section>
        <div class="section-title"><h2>重要提醒</h2><button id="enable-notifications" class="small quiet">启用前台通知</button></div>
        <div id="alerts" class="alerts"><p class="muted">正在读取提醒事件…</p></div>
      </section>
      <section class="desktop-detail">
        <div class="section-title"><h2>当前验收与后续任务</h2><span id="acceptance-summary">N/A</span></div>
        <div id="acceptance" class="acceptance"><p class="muted">正在读取持久验收证据…</p></div>
      </section>
      <section class="task-ledger-section" id="task-ledger-section">
        <div class="section-title"><h2>任务总账</h2><span id="updated">N/A</span></div>
        <div id="tasks" class="tasks"><p class="muted">正在读取 Mac mini 状态…</p></div>
      </section>
      <section>
        <div class="section-title"><h2>最新事件</h2><span id="cursor">cursor 0</span></div>
        <div id="events" class="events"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
