[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-workbench"
version = "1.9.1"
description = "Self-hosted macOS control plane for durable, evidence-gated AI development."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-workbench = "codex_workbench.cli:main"
codex-radar-provider = "codex_radar_provider.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_workbench = ["static/*.html", "static/*.css", "static/*.js", "data/*.json"]
